<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — Xeon Shop</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --teal: #14b8a6;
  --pink: #ec4899;
  --mint: #34d399;
  --dark: #0a0a12;
  --dark2: #12121f;
  --card-bg: rgba(18,18,31,0.8);
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --glow-purple: 0 0 30px rgba(139,92,246,0.4);
  --glow-blue: 0 0 30px rgba(59,130,246,0.4);
  --glow-pink: 0 0 30px rgba(236,72,153,0.4);
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

select, select option { color: #fff; background: #1a1a2e; }
select option:hover { background: #2a2a4e; }

canvas#bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0;
  pointer-events: none;
}

.content { position: relative; z-index: 1; }

header {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(10,10,18,0.8);
  border-bottom: 1px solid rgba(139,92,246,0.15);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, var(--purple), var(--pink), var(--teal));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
  display: flex; align-items: center; gap: 10px;
}
.logo svg { display: block; }
.cart-btn {
  position: relative;
  background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.2));
  border: 1px solid rgba(139,92,246,0.3);
  color: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.3s;
}
.cart-btn:hover {
  border-color: var(--purple);
  box-shadow: var(--glow-purple);
  transform: scale(1.05);
}
.cart-count {
  background: var(--pink);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  position: absolute;
  top: -6px; right: -6px;
  box-shadow: 0 0 12px rgba(236,72,153,0.5);
}

.hero {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(139,92,246,0.15), transparent 70%);
  transform: translate(-50%,-50%);
  pointer-events: none;
}
.hero h1 {
  font-size: clamp(2.5rem, 8vw, 5.5rem);
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--purple), var(--pink), var(--teal), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 300% 300%;
  animation: gradShift 6s ease infinite;
  position: relative;
}
@keyframes gradShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.hero p {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--text-dim);
  max-width: 600px;
  margin-bottom: 36px;
  line-height: 1.7;
}
.hero-cta {
  display: inline-flex; gap: 16px; align-items: center;
}
.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border: none;
  color: #fff;
  padding: 16px 40px;
  border-radius: 14px;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  position: relative;
  overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(transparent, rgba(255,255,255,0.15), transparent 30%);
  animation: spin 4s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn-primary:hover {
  transform: scale(1.06);
  box-shadow: 0 0 40px rgba(139,92,246,0.5), 0 0 80px rgba(236,72,153,0.3);
}
.btn-primary span { position: relative; z-index: 1; }
.btn-secondary {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  padding: 16px 32px;
  border-radius: 14px;
  font-size: 16px; font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
}
.btn-secondary:hover {
  border-color: var(--teal);
  box-shadow: 0 0 30px rgba(20,184,166,0.3);
  transform: scale(1.05);
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 0 24px 60px;
  max-width: 1200px;
  margin: 0 auto;
}
.cat-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-dim);
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all 0.4s;
}
.cat-btn:hover {
  border-color: var(--purple);
  color: #fff;
  background: rgba(139,92,246,0.1);
  box-shadow: 0 0 20px rgba(139,92,246,0.2);
  transform: translateY(-2px);
}
.cat-btn.active {
  background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(236,72,153,0.15));
  border-color: var(--purple);
  color: #fff;
  box-shadow: 0 0 25px rgba(139,92,246,0.25);
}

.products-section {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 24px 80px;
}
.section-title {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 800;
  margin-bottom: 40px;
  text-align: center;
}
.section-title span {
  background: linear-gradient(135deg, var(--teal), var(--mint));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.product-page { padding: 48px 24px 80px; max-width: 1100px; margin: 0 auto; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600;
  margin-bottom: 24px; transition: all 0.3s;
}
.back-link:hover { color: var(--purple); transform: translateX(-4px); }
.product-detail {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px;
  background: var(--card-bg); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px; padding: 36px; position: relative; overflow: hidden;
}
.product-detail::before {
  content: ''; position: absolute; inset: 0; border-radius: 24px; padding: 1px;
  background: linear-gradient(135deg, transparent, transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  transition: all 0.5s;
}
.product-detail:hover::before { background: linear-gradient(135deg, var(--purple), var(--pink), var(--teal)); }
.product-detail-img {
  width: 100%; border-radius: 16px; overflow: hidden;
  background: rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center; min-height: 300px;
}
.product-detail-img img { width: 100%; max-height: 380px; object-fit: contain; padding: 20px; }
.product-gallery { display: flex; flex-direction: column; gap: 12px; }
.product-thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.product-thumbs img {
  width: 72px; height: 72px; object-fit: cover; border-radius: 10px; cursor: pointer;
  border: 2px solid transparent; transition: all 0.3s; background: rgba(255,255,255,0.05); padding: 4px;
}
.product-thumbs img:hover, .product-thumbs img.active { border-color: var(--purple); }
.product-note {
  font-size: 13px; color: #fbbf24;
  background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2);
  padding: 10px 14px; border-radius: 10px; line-height: 1.5;
}
.product-detail-section { margin-top: 8px; }
.product-detail-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #fff; }
.product-box {
  font-size: 14px; color: var(--text-dim); line-height: 1.7;
  padding: 12px 14px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 10px;
}
.product-box::before { content: '📦 '; }
.product-detail-info { display: flex; flex-direction: column; gap: 16px; }
.product-detail-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; line-height: 1.2; }
.product-detail-price {
  font-size: 34px; font-weight: 800;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.product-detail-specs { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.product-detail-specs li {
  font-size: 14px; color: var(--text-dim);
  padding: 10px 14px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 10px;
}
.product-detail-specs li::before { content: '✔ '; color: var(--teal); }
.product-detail .product-stock { align-self: flex-start; }
.product-detail-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.product-detail .add-to-cart { flex: 1; min-width: 200px; padding: 16px 24px; }
.product-detail-link a { color: var(--blue); text-decoration: none; font-size: 14px; font-weight: 600; }
.product-detail-link a:hover { color: var(--purple); }
.product-not-found { text-align: center; padding: 80px 24px; font-size: 18px; color: var(--text-dim); }
.product-not-found a { color: var(--purple); }
.service-variants label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; cursor: pointer; transition: all 0.3s; font-size: 14px; }
.service-variants label:hover { border-color: var(--purple); }
.service-variants input:checked + span { color: #fff; }
.service-variants .svc-price { color: var(--mint); font-weight: 700; }
@media (max-width: 768px) {
  .product-detail { grid-template-columns: 1fr; padding: 24px; gap: 24px; }
  .product-page { padding: 32px 16px 60px; }
}

.product-card {
  background: var(--card-bg);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 28px;
  transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(40px);
  animation: fadeUp 0.7s forwards;
}
.product-card:nth-child(1) { animation-delay: 0.05s; }
.product-card:nth-child(2) { animation-delay: 0.1s; }
.product-card:nth-child(3) { animation-delay: 0.15s; }
.product-card:nth-child(4) { animation-delay: 0.2s; }
.product-card:nth-child(5) { animation-delay: 0.25s; }
.product-card:nth-child(6) { animation-delay: 0.3s; }
.product-card:nth-child(7) { animation-delay: 0.35s; }
.product-card:nth-child(8) { animation-delay: 0.4s; }
.product-card:nth-child(9) { animation-delay: 0.45s; }
.product-card:nth-child(10) { animation-delay: 0.5s; }
.product-card:nth-child(11) { animation-delay: 0.55s; }
.product-card:nth-child(12) { animation-delay: 0.6s; }
.product-card:nth-child(13) { animation-delay: 0.65s; }
.product-card:nth-child(14) { animation-delay: 0.7s; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.product-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(139,92,246,0.06), transparent);
  transition: left 0.7s;
}
.product-card:hover::before { left: 100%; }
.product-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1px;
  background: linear-gradient(135deg, transparent, transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  transition: all 0.5s;
  pointer-events: none;
}
.product-card:hover::after {
  background: linear-gradient(135deg, var(--purple), var(--pink), var(--teal));
}
.product-card:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: rgba(139,92,246,0.2);
  box-shadow: 0 20px 60px rgba(139,92,246,0.15), 0 0 40px rgba(20,184,166,0.05);
}

.product-stock {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 4px 12px;
  border-radius: 50px;
  margin-bottom: 14px;
}
.product-stock.in-stock {
  background: rgba(52,211,153,0.12);
  color: var(--mint);
  border: 1px solid rgba(52,211,153,0.2);
}
.product-stock.out-of-stock {
  background: rgba(239,68,68,0.12);
  color: #ef4444;
  border: 1px solid rgba(239,68,68,0.2);
}
.product-stock .last-one { color: #eab308; }
.product-stock .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulseDot 2s infinite;
}
@keyframes pulseDot {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.product-title {
  font-size: 17px; font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.3;
}
.product-specs {
  list-style: none;
  margin-bottom: 18px;
}
.product-specs li {
  font-size: 13px;
  color: var(--text-dim);
  padding: 3px 0;
  padding-left: 14px;
  position: relative;
}
.product-specs li::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--teal));
  transform: translateY(-50%);
}
.product-links {
  display: flex; gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.product-links a {
  font-size: 12px;
  color: var(--blue);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 4px;
  transition: color 0.3s;
}
.product-links a:hover { color: var(--purple); }
.product-img-wrap {
  width:100%;height:170px;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,0.03);margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.product-img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,var(--dark));
  pointer-events:none;
}
.product-img {
  width:100%;height:100%;object-fit:contain;padding:12px;
  transition:transform .5s cubic-bezier(.23,1,.32,1);
}
.product-card:hover .product-img{transform:scale(1.08)}
.builder-container{grid-column:1/-1;max-width:800px;margin:0 auto;width:100%}
.builder-header{text-align:center;margin-bottom:32px}
.builder-header h2{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.builder-header p{color:var(--text-dim);font-size:14px}
.builder-form{background:var(--card-bg);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:18px}
.builder-section h3{font-size:14px;font-weight:700;color:var(--text-dim);margin-bottom:8px;letter-spacing:.3px}
.builder-section select,.builder-section input[type="number"]{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#1a1a2e;color:#fff;font-size:14px;outline:none;transition:all .3s;appearance:auto}
.builder-section select option{background:#1a1a2e;color:#fff;padding:8px}
.builder-section select:focus,.builder-section input:focus{border-color:var(--purple);box-shadow:0 0 20px rgba(139,92,246,.15)}
.builder-row{display:flex;gap:12px;align-items:center}
.builder-qty{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);white-space:nowrap}
.builder-qty input{width:60px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;text-align:center;outline:none}
.builder-qty input:focus{border-color:var(--purple)}
.builder-services{display:flex;flex-direction:column;gap:8px}
.builder-check{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;font-size:14px;color:var(--text)}
.builder-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--purple);cursor:pointer}
.builder-assembly-info{padding:10px 14px;border-radius:10px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);font-size:14px;font-weight:600;color:#a78bfa}
.builder-total{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;border-top:1px solid rgba(255,255,255,.06)}
.builder-total-label{font-size:20px;font-weight:700}
.builder-total-price{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.builder-add-btn{width:100%;padding:18px;border:none;border-radius:14px;font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px}
.builder-add-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,92,246,.4)}
@media(max-width:600px){.builder-form{padding:20px}.builder-total-price{font-size:24px}.builder-row{flex-direction:column;align-items:stretch}}
.service-card .product-stock{background:rgba(139,92,246,0.15);color:#a78bfa}
.service-variants{
  display:flex;flex-direction:column;gap:8px;margin:12px 0 14px;position:relative;z-index:1;
}
.service-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);
  transition:all 0.3s;
}
.service-option:hover{border-color:rgba(139,92,246,0.3);background:rgba(139,92,246,0.08)}
.service-option input[type="radio"]{display:none}
.service-option:has(input:checked){
  border-color:#8b5cf6;background:rgba(139,92,246,0.15);
  box-shadow:0 0 20px rgba(139,92,246,0.15);
}
.option-label{font-size:13px;font-weight:600;color:var(--text)}
.option-price{font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.product-bottom {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.product-price {
  font-size: 24px; font-weight: 800;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.add-to-cart {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border: none;
  color: #fff;
  padding: 10px 22px;
  border-radius: 12px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.add-to-cart:hover {
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(59,130,246,0.4), 0 0 60px rgba(139,92,246,0.2);
}
.add-to-cart:active { transform: scale(0.95); }
.add-to-cart.added {
  background: linear-gradient(135deg, var(--mint), var(--teal));
  box-shadow: 0 0 30px rgba(52,211,153,0.4);
}

.scroll-reveal {
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
}
.scroll-reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* Cart Overlay */
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.cart-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.cart-sidebar {
  position: fixed;
  top: 0; right: 0;
  width: min(450px, 100vw);
  height: 100vh;
  background: var(--dark2);
  border-left: 1px solid rgba(139,92,246,0.15);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  display: flex; flex-direction: column;
  padding: 24px;
}
.cart-overlay.open .cart-sidebar { transform: translateX(0); }
.cart-header {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 20px;
}
.cart-header h2 {
  font-size: 20px; font-weight: 700;
}
.cart-close {
  background: none; border: none;
  color: var(--text-dim);
  font-size: 28px; cursor: pointer;
  transition: color 0.3s;
  line-height: 1;
}
.cart-close:hover { color: #fff; }
.cart-items {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 12px;
  padding-right: 8px;
}
.cart-items::-webkit-scrollbar {
  width: 4px;
}
.cart-items::-webkit-scrollbar-track {
  background: transparent;
}
.cart-items::-webkit-scrollbar-thumb {
  background: rgba(139,92,246,0.3);
  border-radius: 10px;
}
.cart-empty {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 0;
  font-size: 15px;
}
.cart-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex; gap: 12px; align-items: center;
}
.cart-item-info { flex: 1; }
.cart-item-title {
  font-size: 14px; font-weight: 600;
  margin-bottom: 4px;
}
.cart-item-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; white-space: pre-line; }
.cart-item-price {
  font-size: 15px; font-weight: 700;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cart-qty-controls { display: inline-flex; align-items: center; gap: 6px; }
.cart-qty-btn {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.cart-qty-btn:hover { background: rgba(139,92,246,0.2); border-color: var(--purple); }
.cart-qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.cart-qty-num { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
.cart-item-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.cart-item-remove {
  background: rgba(239,68,68,0.15);
  border: none;
  color: #ef4444;
  width: 32px; height: 32px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.cart-item-remove:hover {
  background: rgba(239,68,68,0.3);
  box-shadow: 0 0 20px rgba(239,68,68,0.3);
}
.cart-footer {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 20px;
  margin-top: 20px;
}
.cart-total {
  display: flex; justify-content: space-between;
  font-size: 18px; font-weight: 700;
  margin-bottom: 16px;
}
.cart-total span:last-child {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cart-clear {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-dim);
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.3s;
  margin-bottom: 12px;
  width: 100%;
}
.cart-clear:hover {
  border-color: #ef4444;
  color: #ef4444;
}
.checkout-btn {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border: none;
  color: #fff;
  padding: 16px;
  border-radius: 14px;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.checkout-btn::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(transparent, rgba(255,255,255,0.1), transparent 30%);
  animation: spin 4s linear infinite;
}
.checkout-btn:hover {
  transform: scale(1.02);
  box-shadow: 0 0 40px rgba(139,92,246,0.4);
}
.checkout-btn span { position: relative; z-index: 1; }

footer {
  text-align: center;
  padding: 40px 24px;
  border-top: 1px solid rgba(255,255,255,0.06);
  color: var(--text-dim);
  font-size: 14px;
}

@media (max-width: 768px) {
  header { padding: 0 16px; }
  .products-grid { grid-template-columns: 1fr; }
  .cart-sidebar { width: 100vw; }
  .hero h1 { font-size: clamp(2rem, 10vw, 3rem); }
  .hero-cta { flex-direction: column; }
  .product-card { padding: 20px; }
  .product-bottom { flex-direction: column; align-items: stretch; }
  .add-to-cart { text-align: center; }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .products-grid { grid-template-columns: repeat(2, 1fr); }
}

.notification {
  position: fixed;
  bottom: 30px; right: 30px;
  z-index: 300;
  background: linear-gradient(135deg, var(--dark2), rgba(139,92,246,0.15));
  border: 1px solid rgba(139,92,246,0.3);
  border-radius: 16px;
  padding: 16px 24px;
  color: #fff;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  transform: translateX(120%);
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  display: flex; align-items: center; gap: 10px;
}
.notification.show { transform: translateX(0); }

.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--dark2);border:1px solid rgba(255,255,255,.1);border-radius:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .4s cubic-bezier(.23,1,.32,1)}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 16px}
.modal-header h2{font-size:20px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:28px;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.modal-body{padding:0 28px 20px;display:flex;flex-direction:column;gap:8px}
.modal-label{font-size:13px;font-weight:600;color:var(--text-dim);margin-top:4px}
.modal-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;transition:all .3s;font-family:inherit}
.modal-input:focus{border-color:var(--purple);box-shadow:0 0 20px rgba(139,92,246,.15)}
.modal-textarea{resize:vertical;min-height:60px}
.modal-input option{background:#1a1a2e;color:#fff}
.modal-error{color:#ef4444;font-size:13px;min-height:18px;margin-top:4px}
.modal-footer{display:flex;gap:12px;padding:16px 28px 24px;border-top:1px solid rgba(255,255,255,.06)}
.modal-btn-secondary{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:all .3s}
.modal-btn-secondary:hover{border-color:var(--purple)}
.modal-btn-primary{flex:2;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s}
.modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,92,246,.4)}
.modal-btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
@media(max-width:600px){.modal-body{padding:0 20px 16px}.modal-header{padding:20px 20px 12px}.modal-footer{padding:12px 20px 20px}}
.notification-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--mint), var(--teal));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

@media (max-width: 480px) {
  .notification { left: 16px; right: 16px; bottom: 16px; }
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="content">
<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#g1)" stroke-width="2.5" fill="rgba(139,92,246,0.08)"/>
      <path d="M8 14h12M14 8v12" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="28" y2="28">
          <stop stop-color="#8b5cf6"/>
          <stop offset="0.5" stop-color="#ec4899"/>
          <stop offset="1" stop-color="#14b8a6"/>
        </linearGradient>
      </defs>
    </svg>
    XEON SHOP
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Корзина
    <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<section class="product-page">
  <a class="back-link" href="index.html">← Назад в каталог</a>
  <div id="product-page"></div>
</section>

<footer>
  <p>XEON SHOP &copy; 2026 — Комплектующие для ПК и серверов</p>
</footer>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="if(event.target===this) toggleCart()">
  <div class="cart-sidebar">
    <div class="cart-header">
      <h2>🛒 Корзина</h2>
      <button class="cart-close" onclick="toggleCart()">×</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty">Корзина пуста</div>
    </div>
    <div class="cart-footer">
      <button class="cart-clear" onclick="clearCart()">🗑 Очистить всё</button>
      <div class="cart-total"><span>Итого:</span><span id="cart-total">0 ₽</span></div>
      <button class="checkout-btn" onclick="showCheckoutForm()"><span>Оформить заказ</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>📋 Оформление заказа</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-dim);margin-bottom:16px;font-size:14px">Подтвердите отправку заказа</p>
      <label class="modal-label">Комментарий / Адрес</label>
      <textarea class="modal-input modal-textarea" id="checkout-comment" rows="3" placeholder="Адрес доставки, пожелания..."></textarea>
      <div class="modal-error" id="checkout-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="modal-btn-primary" onclick="submitOrder()">Отправить заказ</button>
    </div>
  </div>
</div>

<div class="notification" id="notification">
  <div class="notification-icon">✓</div>
  <span id="notification-msg">Товар добавлен в корзину</span>
</div>

<script src="products.js"></script>
<script>

let cart = JSON.parse(localStorage.getItem('xeonCart') || '[]');
let currentCategory = 'all';

function initCategories() {
  const container = document.getElementById('categories');
  container.innerHTML = categories.map(c =>
    `<button class="cat-btn${c.id === 'all' ? ' active' : ''}" onclick="filterCategory('${c.id}')">${c.label}</button>`
  ).join('');
}

function filterCategory(catId) {
  currentCategory = catId;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick')?.includes(catId)));
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById('products-grid');
  if (currentCategory === 'builder') {
    grid.innerHTML = buildConfigurator();
    return;
  }
  const filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
  if (filtered.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--text-dim);font-size:18px">Нет товаров в этой категории</div>';
    return;
  }
  grid.innerHTML = filtered.map(p => {
    if (p.type === 'service') {
      return `
      <div class="product-card service-card">
        <div class="product-img-wrap">
          <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="product-stock in-stock"><span class="dot"></span>Услуга</div>
        <div class="product-title">${p.name}</div>
        <ul class="product-specs">${p.specs.map(s => `<li>${s}</li>`).join('')}</ul>
        <div class="service-variants">
          ${p.variants.map((v,i) => `
            <label class="service-option" data-id="${p.id}" data-idx="${i}">
              <input type="radio" name="svc-${p.id}" value="${i}" ${i===0?'checked':''} onchange="updateServicePrice(${p.id})">
              <span class="option-label">${v.label}</span>
              <span class="option-price">${v.price.toLocaleString()} ₽</span>
            </label>
          `).join('')}
        </div>
        <div class="product-bottom">
          <div class="product-price" id="svc-price-${p.id}">${p.variants[0].price.toLocaleString()} ₽</div>
          <button class="add-to-cart" onclick="addToCart(${p.id}, this)">
            <span>Заказать</span>
          </button>
        </div>
      </div>
      `;
    }
    const inStock = p.stock > 0;
    return `
      <div class="product-card">
        <div class="product-img-wrap">
          <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="product-stock ${inStock ? 'in-stock' : 'out-of-stock'}">
          <span class="dot"></span>
          ${inStock ? (p.stock === 1 ? '<span class="last-one">Последний</span>' : 'В наличии') : 'Нет в наличии'}
        </div>
        <div class="product-title">${p.name}</div>
        <ul class="product-specs">${p.specs.map(s => `<li>${s}</li>`).join('')}</ul>
        ${p.link ? `<div class="product-links"><a href="${p.link}" target="_blank" rel="noopener">Официальный сайт ↗</a></div>` : ''}
        <div class="product-bottom">
          <div class="product-price">${p.price.toLocaleString()} ₽</div>
          <button class="add-to-cart" onclick="addToCart(${p.id}, this)" ${!inStock ? 'disabled style="opacity:0.3;cursor:not-allowed"' : ''}>
            ${inStock ? 'В корзину' : 'Нет в наличии'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function updateServicePrice(id) {
  const p = products.find(x => x.id === id);
  if (!p || !p.variants) return;
  const sel = document.querySelector(`input[name="svc-${id}"]:checked`);
  if (!sel) return;
  const idx = parseInt(sel.value);
  const v = p.variants[idx];
  const el = document.getElementById(`svc-price-${id}`);
  if (el) el.textContent = v.price.toLocaleString() + ' ₽';
}

function getByCat(cat) { return products.filter(p => p.category === cat && p.stock > 0); }

function builderOpts(cat, placeholder) {
  const items = getByCat(cat);
  return `<option value="">${placeholder}</option>${items.map(p => `<option value="${p.id}" data-price="${p.price}">${p.name} — ${p.price.toLocaleString()} ₽</option>`).join('')}`;
}

function filteredOpts(items, excludeId, minStock) {
  let opts = '<option value="">— нет —</option>';
  items.forEach(p => {
    if (p.stock < minStock) return;
    if (excludeId && p.id === excludeId && p.stock < 2) return;
    opts += `<option value="${p.id}" data-price="${p.price}">${p.name} — ${p.price.toLocaleString()} ₽</option>`;
  });
  return opts;
}

function rebuildFiltered(selectId, items, excludeId, minStock) {
  const el = document.getElementById(selectId);
  if (!el) return;
  const val = el.value;
  el.innerHTML = filteredOpts(items, excludeId, minStock);
  if (val && Array.from(el.options).some(o => o.value === val)) el.value = val;
  calcBuilderTotal();
}

function buildConfigurator() {
  return `
    <div class="builder-container">
      <div class="builder-header">
        <h2>🔧 Конфигуратор ПК</h2>
        <p>Выберите комплектующие из наличия. Цена рассчитывается автоматически.</p>
      </div>
      <div class="builder-form">
        <div class="builder-section">
          <h3>📟 Материнская плата</h3>
          <select id="b-mb" onchange="onMbChange()">${builderOpts('motherboards','— нет —')}</select>
        </div>
        <div class="builder-section" id="b-cpu1-wrap">
          <h3>💎 Процессор #1</h3>
          <select id="b-cpu1" onchange="onCpu1Change()">${builderOpts('cpus','— нет —')}</select>
        </div>
        <div class="builder-section" id="b-cpu2-wrap" style="display:none">
          <h3>💎 Процессор #2</h3>
          <select id="b-cpu2" onchange="calcBuilderTotal()"><option value="">— нет —</option></select>
        </div>
        <div class="builder-section">
          <h3>🧠 Оперативная память</h3>
          <div class="builder-row">
            <select id="b-ram" style="flex:1" onchange="onRamChange()">${builderOpts('memory','— нет —')}</select>
            <label class="builder-qty">Кол-во: <input type="number" id="b-ram-qty" value="1" min="1" max="16" oninput="calcBuilderTotal()"></label>
          </div>
        </div>
        <div class="builder-section" id="b-cool1-wrap">
          <h3>❄️ Кулер #1</h3>
          <select id="b-cool1" onchange="onCool1Change()">${builderOpts('coolers','— нет —')}</select>
        </div>
        <div class="builder-section" id="b-cool2-wrap" style="display:none">
          <h3>❄️ Кулер #2</h3>
          <select id="b-cool2" onchange="calcBuilderTotal()"><option value="">— нет —</option></select>
        </div>
        <div class="builder-section">
          <h3>💾 Накопитель #1</h3>
          <select id="b-stor1" onchange="onStor1Change()">${filteredOpts([...getByCat('ssd'),...getByCat('nvme')], null, 1)}</select>
        </div>
        <div class="builder-section">
          <h3>💾 Накопитель #2</h3>
          <select id="b-stor2" onchange="calcBuilderTotal()"><option value="">— нет —</option></select>
        </div>
        <div class="builder-section">
          <h3>🎮 Видеокарта</h3>
          <select id="b-gpu" onchange="calcBuilderTotal()">${builderOpts('gpus','— нет —')}</select>
        </div>
        <div class="builder-section">
          <h3>🔌 Блок питания</h3>
          <select id="b-psu" onchange="calcBuilderTotal()">${builderOpts('psu','— нет —')}</select>
        </div>
        <div class="builder-section">
          <h3>🖥 Корпус</h3>
          <select id="b-case" onchange="calcBuilderTotal()">${builderOpts('cases','— нет —')}</select>
        </div>
        <div class="builder-section builder-services">
          <h3>🛠 Услуги</h3>
          <div class="builder-assembly-info" id="b-assembly-info">Сборка: —</div>
          <label class="builder-check"><input type="checkbox" id="b-win" onchange="calcBuilderTotal()"> Установка Windows 10/11 — 500 ₽</label>
        </div>
        <div class="builder-total">
          <div class="builder-total-label">Итого:</div>
          <div class="builder-total-price" id="b-total">0 ₽</div>
        </div>
        <button class="builder-add-btn" onclick="addBuilderToCart()">Добавить сборку в корзину</button>
      </div>
    </div>
  `;
}

function onCpu1Change() {
  const mbId = parseInt(document.getElementById('b-mb').value);
  const mb = products.find(p => p.id === mbId);
  if (mb && mb.dual) {
    const cpu1 = parseInt(document.getElementById('b-cpu1').value);
    rebuildFiltered('b-cpu2', getByCat('cpus'), cpu1, 2);
  }
  calcBuilderTotal();
}

function onCool1Change() {
  const mbId = parseInt(document.getElementById('b-mb').value);
  const mb = products.find(p => p.id === mbId);
  if (mb && mb.dual) {
    const cool1 = parseInt(document.getElementById('b-cool1').value);
    rebuildFiltered('b-cool2', getByCat('coolers'), cool1, 2);
  }
  calcBuilderTotal();
}

function onStor1Change() {
  const stor1 = parseInt(document.getElementById('b-stor1').value);
  const allStor = [...getByCat('ssd'), ...getByCat('nvme')];
  const exclude = stor1 ? stor1 : null;
  const el = document.getElementById('b-stor2');
  const val = el.value;
  el.innerHTML = filteredOpts(allStor, exclude, 1);
  if (val && Array.from(el.options).some(o => o.value === val)) el.value = val;
  calcBuilderTotal();
}

function onMbChange() {
  const sel = document.getElementById('b-mb');
  const id = parseInt(sel.value);
  const mb = products.find(p => p.id === id);
  const isDual = mb && mb.dual;
  document.getElementById('b-cpu2-wrap').style.display = isDual ? '' : 'none';
  document.getElementById('b-cool2-wrap').style.display = isDual ? '' : 'none';
  if (isDual) {
    const cpu1 = parseInt(document.getElementById('b-cpu1').value);
    const cpus = getByCat('cpus');
    rebuildFiltered('b-cpu2', cpus, cpu1, 2);
    const cool1 = parseInt(document.getElementById('b-cool1').value);
    const coolers = getByCat('coolers');
    rebuildFiltered('b-cool2', coolers, cool1, 2);
  }
  calcBuilderTotal();
}

function getSelPrice(id) {
  const el = document.getElementById(id);
  if (!el || !el.value) return 0;
  const opt = el.options[el.selectedIndex];
  return parseInt(opt.dataset.price) || 0;
}

function getSelName(id) {
  const el = document.getElementById(id);
  if (!el || !el.value) return '';
  const opt = el.options[el.selectedIndex];
  const p = products.find(x => x.id === parseInt(el.value));
  return p ? p.name : opt.text.split(' —')[0];
}

function getAssemblyPrice(isDual) {
  const hasPsu = document.getElementById('b-psu').value !== '';
  const hasCase = document.getElementById('b-case').value !== '';
  if (isDual) {
    if (hasPsu && hasCase) return { price: 2500, label: 'Все наше' };
    if (hasPsu || hasCase) return { price: 3000, label: 'Ваш БП или корпус' };
    return { price: 3500, label: 'Ваш БП и корпус' };
  }
  if (hasPsu && hasCase) return { price: 2000, label: 'Все наше' };
  if (hasPsu || hasCase) return { price: 2500, label: 'Ваш БП или корпус' };
  return { price: 3000, label: 'Ваш БП и корпус' };
}

function onRamChange() {
  const sel = document.getElementById('b-ram');
  const id = parseInt(sel.value);
  const p = products.find(x => x.id === id);
  const qty = document.getElementById('b-ram-qty');
  if (p) { qty.max = p.stock; if (parseInt(qty.value) > p.stock) qty.value = p.stock; }
  else { qty.max = 16; qty.value = 1; }
  calcBuilderTotal();
}

function calcBuilderTotal() {
  let total = 0;
  const parts = [];
  const mbId = parseInt(document.getElementById('b-mb').value);
  const mb = products.find(p => p.id === mbId);
  const isDual = mb && mb.dual;

  const mbPrice = getSelPrice('b-mb');
  if (mbPrice) { total += mbPrice; parts.push('Материнская плата'); }

  const cpu1Price = getSelPrice('b-cpu1');
  if (cpu1Price) { total += cpu1Price; parts.push('Процессор #1'); }

  if (isDual) {
    const cpu2Price = getSelPrice('b-cpu2');
    if (cpu2Price) { total += cpu2Price; parts.push('Процессор #2'); }
  }

  const ramPrice = getSelPrice('b-ram');
  let ramQty = parseInt(document.getElementById('b-ram-qty').value) || 1;
  const ramSel = parseInt(document.getElementById('b-ram').value);
  const ramProd = products.find(x => x.id === ramSel);
  if (ramProd && ramQty > ramProd.stock) { ramQty = ramProd.stock; document.getElementById('b-ram-qty').value = ramQty; }
  if (ramPrice) { total += ramPrice * ramQty; parts.push('Память ×' + ramQty); }

  const cool1Price = getSelPrice('b-cool1');
  if (cool1Price) { total += cool1Price; parts.push('Кулер #1'); }

  if (isDual) {
    const cool2Price = getSelPrice('b-cool2');
    if (cool2Price) { total += cool2Price; parts.push('Кулер #2'); }
  }

  const stor1Price = getSelPrice('b-stor1');
  if (stor1Price) { total += stor1Price; parts.push('Накопитель #1'); }

  const stor2Price = getSelPrice('b-stor2');
  if (stor2Price) { total += stor2Price; parts.push('Накопитель #2'); }

  const gpuPrice = getSelPrice('b-gpu');
  if (gpuPrice) { total += gpuPrice; parts.push('Видеокарта'); }

  const psuPrice = getSelPrice('b-psu');
  if (psuPrice) { total += psuPrice; parts.push('БП'); }

  const casePrice = getSelPrice('b-case');
  if (casePrice) { total += casePrice; parts.push('Корпус'); }

  const assembly = getAssemblyPrice(isDual);
  total += assembly.price;
  parts.push('Сборка (' + assembly.label + ')');
  document.getElementById('b-assembly-info').textContent = 'Сборка: ' + assembly.label + ' — ' + assembly.price.toLocaleString() + ' ₽';

  const win = document.getElementById('b-win').checked;
  if (win) { total += 500; parts.push('Windows'); }

  document.getElementById('b-total').textContent = total.toLocaleString() + ' ₽';
  document.getElementById('b-total').dataset.parts = JSON.stringify(parts);
  document.getElementById('b-total').dataset.total = total;
}

function addBuilderToCart() {
  const total = parseInt(document.getElementById('b-total').dataset.total) || 0;
  if (total === 0) { showNotification('Выберите хотя бы один компонент'); return; }

  const lines = [];
  const mbId = parseInt(document.getElementById('b-mb').value);
  const mb = products.find(p => p.id === mbId);
  const isDual = mb && mb.dual;

  function addLine(id, qty) {
    const el = document.getElementById(id);
    if (!el || !el.value) return;
    const name = getSelName(id);
    const price = getSelPrice(id);
    if (!price) return;
    lines.push(`${name} — ${(price*(qty||1)).toLocaleString()} ₽`);
  }

  addLine('b-mb');
  addLine('b-cpu1');
  if (isDual) addLine('b-cpu2');

  const ramPrice = getSelPrice('b-ram');
  const ramQty = parseInt(document.getElementById('b-ram-qty').value) || 1;
  if (ramPrice) lines.push(`${getSelName('b-ram')} ×${ramQty} — ${(ramPrice*ramQty).toLocaleString()} ₽`);

  addLine('b-cool1');
  if (isDual) addLine('b-cool2');
  addLine('b-stor1');
  addLine('b-stor2');
  addLine('b-gpu');
  addLine('b-psu');
  addLine('b-case');

  const assembly = getAssemblyPrice(isDual);
  lines.push('Сборка (' + assembly.label + ') — ' + assembly.price.toLocaleString() + ' ₽');

  if (document.getElementById('b-win').checked) lines.push('Windows — 500 ₽');

  const name = 'Сборка ПК (конфигуратор)';
  cart.push({ id: 'build-' + Date.now(), qty: 1, name: name, price: total, desc: lines.join('\n') });
  saveCart();
  updateCartUI();
  showNotification('Сборка добавлена в корзину — ' + total.toLocaleString() + ' ₽');
}

function addToCart(id, btn) {
  const prod = products.find(p => p.id === id);
  if (!prod) return;
  if (prod.variants) {
    const sel = document.querySelector(`input[name="svc-${id}"]:checked`);
    if (!sel) return;
    const idx = parseInt(sel.value);
    const v = prod.variants[idx];
    const key = 'svc-' + id + '-' + idx;
    const existing = cart.find(c => c.id === key);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id: key, qty: 1, name: prod.name + ' (' + v.label + ')', price: v.price });
    }
    saveCart();
    updateCartUI();
    btn.innerHTML = '<span>✓ Добавлено</span>';
    btn.classList.add('added');
    const btnLabel = prod.type === 'service' ? 'Заказать' : 'В корзину';
    setTimeout(() => {
      btn.innerHTML = `<span>${btnLabel}</span>`;
      btn.classList.remove('added');
    }, 1500);
    showNotification(`${prod.name} (${v.label}) — в корзине`);
    return;
  }
  if (prod.stock <= 0) return;
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id, qty: 1, name: prod.name, price: prod.price });
  }
  saveCart();
  updateCartUI();
  btn.textContent = '✓ Добавлено';
  btn.classList.add('added');
  setTimeout(() => {
    btn.textContent = 'В корзину';
    btn.classList.remove('added');
  }, 1500);
  showNotification(`${prod.name} добавлена в корзину`);
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  updateCartUI();
}

function changeQty(index, delta) {
  const c = cart[index];
  if (!c) return;
  const newQty = c.qty + delta;
  if (newQty < 1) { cart.splice(index, 1); }
  else {
    if (typeof c.id === 'number') {
      const prod = products.find(p => p.id === c.id);
      if (prod && prod.type !== 'service' && newQty > (prod.stock || 0)) {
        showNotification('Недостаточно товара в наличии'); return;
      }
    }
    c.qty = newQty;
  }
  saveCart();
  updateCartUI();
  showNotification(delta > 0 ? 'Товар добавлен' : 'Товар убран');
}

function removeFromCartByIndex(idx) {
  cart.splice(idx, 1);
  saveCart();
  updateCartUI();
}

function clearCart() {
  cart = [];
  saveCart();
  updateCartUI();
}

function saveCart() { localStorage.setItem('xeonCart', JSON.stringify(cart)); }

function getCartTotal() {
  return cart.reduce((sum, c) => sum + (c.price || 0) * c.qty, 0);
}

function updateCartUI() {
  const count = cart.reduce((s, c) => s + c.qty, 0);
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-total').textContent = getCartTotal().toLocaleString() + ' ₽';
  const container = document.getElementById('cart-items');
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
    return;
  }
  container.innerHTML = cart.map((c, i) => {
    const name = c.name || 'Товар';
    const desc = c.desc || '';
    const isNumId = typeof c.id === 'number';
    const isBuilder = typeof c.id === 'string' && c.id.startsWith('build-');
    const prod = isNumId ? products.find(p => p.id === c.id) : null;
    const maxQty = prod && prod.type !== 'service' ? (prod.stock || 0) : 99;
    return `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-title">${name}${c.qty > 1 ? ` ×${c.qty}` : ''}</div>
          ${desc ? `<div class="cart-item-desc">${desc}</div>` : ''}
          <div class="cart-item-row">
            ${isBuilder ? '' : `
            <div class="cart-qty-controls">
              <button class="cart-qty-btn" onclick="changeQty(${i}, -1)" ${c.qty <= 1 ? 'disabled' : ''}>−</button>
              <span class="cart-qty-num">${c.qty}</span>
              <button class="cart-qty-btn" onclick="changeQty(${i}, 1)" ${c.qty >= maxQty ? 'disabled' : ''}>+</button>
            </div>`}
            <div class="cart-item-price">${(c.price * c.qty).toLocaleString()} ₽</div>
          </div>
        </div>
        <button class="cart-item-remove" onclick="removeFromCartByIndex(${i})">×</button>
      </div>
    `;
  }).join('');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function showCheckoutForm() {
  if (!cart.length) { showNotification('Корзина пуста'); return; }
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('checkout-error').textContent = '';
}

function submitOrder() {
  const total = getCartTotal();
  const orderId = 'XEON-' + Date.now().toString(36).toUpperCase();
  let details = '';
  cart.forEach(c => {
    details += c.name + (c.qty > 1 ? ' ×' + c.qty : '') + ' — ' + (c.price * c.qty).toLocaleString() + ' ₽\n';
    if (c.desc) details += '  ' + c.desc + '\n';
  });

  const comment = document.getElementById('checkout-comment').value.trim();

  const GOOGLE_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSet8V9lgwR0XVRdGEbRj-nhGM7qa7ZP3fjEol_uVqIWHuv0RQ/formResponse';

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = GOOGLE_FORM;
  form.target = '_blank';

  const fields = {
    'entry.1235920526': orderId,
    'entry.2047625780': details,
    'entry.149902418': total.toLocaleString() + ' ₽',
    'entry.1527545222': '',
    'entry.1461400834': comment,
    'entry.1375472207': '',
    'entry.687754715': '',
  };

  for (const [name, value] of Object.entries(fields)) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value;
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  closeModal();
  cart = []; saveCart(); updateCartUI();
  showNotification('Заказ ' + orderId + ' отправлен! Мы свяжемся с вами');
}

function orderNow() { showCheckoutForm(); }

let cartOpen = false;
function toggleCart() {
  cartOpen = !cartOpen;
  document.getElementById('cart-overlay').classList.toggle('open', cartOpen);
  document.body.style.overflow = cartOpen ? 'hidden' : '';
  updateCartUI();
}

let notifTimeout;
function showNotification(msg) {
  clearTimeout(notifTimeout);
  const el = document.getElementById('notification');
  document.getElementById('notification-msg').textContent = msg;
  el.classList.add('show');
  notifTimeout = setTimeout(() => el.classList.remove('show'), 3000);
}

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('revealed'); }
  });
}, { threshold: 0.15 });
document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));

// Animated Background Canvas
(function initBg() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  class Particle {
    constructor() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = Math.random() * 3 + 1;
      this.speedX = (Math.random() - 0.5) * 0.5;
      this.speedY = (Math.random() - 0.5) * 0.5;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.color = ['#8b5cf6','#3b82f6','#14b8a6','#ec4899','#34d399'][Math.floor(Math.random() * 5)];
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > w) this.speedX *= -1;
      if (this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  function createParticles(count) {
    particles = [];
    for (let i = 0; i < count; i++) particles.push(new Particle());
  }
  createParticles(100);
  let mouse = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  function animate() {
    ctx.clearRect(0, 0, w, h);
    // gradient background
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h)*0.7);
    grad.addColorStop(0, 'rgba(18,18,31,1)');
    grad.addColorStop(0.5, 'rgba(10,10,18,1)');
    grad.addColorStop(1, 'rgba(5,5,12,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // ambient glow around mouse
    if (mouse.x > 0) {
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 300);
      g.addColorStop(0, 'rgba(139,92,246,0.06)');
      g.addColorStop(0.5, 'rgba(236,72,153,0.03)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
    particles.forEach(p => { p.update(); p.draw(); });
    // draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(139,92,246,${0.04 * (1 - dist/120)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

function renderProductPage() {
  const container = document.getElementById('product-page');
  const id = parseInt(new URLSearchParams(location.search).get('id'));
  const p = products.find(x => x.id === id);
  if (!p || p.hidden) {
    container.innerHTML = '<div class="product-not-found">Товар не найден. <a href="index.html">Вернуться в каталог</a></div>';
    document.title = 'Товар не найден — Xeon Shop';
    return;
  }
  document.title = p.name + ' — Xeon Shop';
  const inStock = p.stock > 0;
  let buyBlock = '';
  if (p.variants) {
    const radios = p.variants.map((v, i) =>
      `<label class="service-variant">
        <input type="radio" name="svc-${p.id}" value="${i}" ${i === 0 ? 'checked' : ''} onchange="updateServicePrice(${p.id})">
        <span>${v.label}</span>
        <span class="svc-price">${v.price.toLocaleString()} ₽</span>
      </label>`
    ).join('');
    const btnLabel = p.type === 'service' ? 'Заказать' : 'В корзину';
    buyBlock = `
      <div class="service-variants">${radios}</div>
      <div class="product-detail-actions">
        <div class="product-detail-price" id="svc-price-${p.id}">${p.variants[0].price.toLocaleString()} ₽</div>
        <button class="add-to-cart" onclick="addToCart(${p.id}, this)" ${p.type !== 'service' && !inStock ? 'disabled style="opacity:0.3;cursor:not-allowed"' : ''}>
          ${p.type === 'service' || inStock ? btnLabel : 'Нет в наличии'}
        </button>
      </div>
    `;
  } else {
    buyBlock = `
      <div class="product-detail-actions">
        <div class="product-detail-price">${p.price.toLocaleString()} ₽</div>
        <button class="add-to-cart" onclick="addToCart(${p.id}, this)" ${!inStock ? 'disabled style="opacity:0.3;cursor:not-allowed"' : ''}>
          ${inStock ? 'В корзину' : 'Нет в наличии'}
        </button>
      </div>
    `;
  }
  const gallery = p.gallery && p.gallery.length ? p.gallery : [p.img];
  container.innerHTML = `
    <div class="product-detail">
      <div class="product-gallery">
        <div class="product-detail-img">
          <img id="main-img" src="${gallery[0]}" alt="${p.name}" onerror="this.style.display='none'">
        </div>
        ${gallery.length > 1 ? `
        <div class="product-thumbs">
          ${gallery.map((g, gi) => `<img src="${g}" onclick="setMainImg(this.src, ${gi})" class="${gi === 0 ? 'active' : ''}" loading="lazy" onerror="this.style.display='none'" alt="${p.name} фото ${gi + 1}">`).join('')}
        </div>` : ''}
      </div>
      <div class="product-detail-info">
        <div class="product-stock ${inStock ? 'in-stock' : 'out-of-stock'}">
          <span class="dot"></span>
          ${inStock ? (p.stock === 1 ? '<span class="last-one">Последний</span>' : 'В наличии') : 'Нет в наличии'}
        </div>
        <h1 class="product-detail-title">${p.name}</h1>
        ${p.note ? `<div class="product-note">${p.note}</div>` : ''}
        ${buyBlock}
        ${p.descFull ? `
        <div class="product-detail-section">
          <h3>Описание</h3>
          <ul class="product-detail-specs">${p.descFull.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : `<ul class="product-detail-specs">${p.specs.map(s => `<li>${s}</li>`).join('')}</ul>`}
        ${p.link ? `<div class="product-detail-link"><a href="${p.link}" target="_blank" rel="noopener">Официальный сайт ↗</a></div>` : ''}
      </div>
    </div>
  `;
}

function setMainImg(src, i) {
  const main = document.getElementById('main-img');
  if (main) main.src = src;
  document.querySelectorAll('.product-thumbs img').forEach((t, ti) => t.classList.toggle('active', ti === i));
}

// Init
renderProductPage();
updateCartUI();
